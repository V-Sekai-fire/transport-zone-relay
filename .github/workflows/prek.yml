name: prek
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prek:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          manifest-path: .github/prek/pixi.toml
          locked: true
      - name: The hooks of .pre-commit-config.yaml on every file
        run: pixi run --manifest-path .github/prek/pixi.toml prek
