app = "CHANGE-ME"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[[vm]]
  size = "performance-2x"

[processes]
  app = "fly-public.sh"

[[services]]
  protocol = "udp"
  internal_port = 47600
  processes = ["app"]
  [[services.ports]]
    port = 47600

[[services]]
  protocol = "udp"
  internal_port = 47601
  processes = ["app"]
  [[services.ports]]
    port = 47601
